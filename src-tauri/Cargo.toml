[package]
name = "wiener-dl"
version = "0.1.3"
description = "Paste URL → MP4. macOS video downloader."
authors = ["Wiener Labs <baturalp@wienerlabs.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wiener_dl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
